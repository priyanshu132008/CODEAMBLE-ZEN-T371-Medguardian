[pytest]
# Deterministic test configuration for MedGuardian.
#
# The normal suite must NEVER require live external services (OpenRouter,
# Ollama/LocalAI, a running uvicorn server, or network). These four scripts
# make real billed/external calls or start a real server and are therefore
# excluded from normal collection. They are KEPT on disk (not deleted) and
# remain runnable directly:
#
#     cd backend && python test_openrouter.py
#     cd backend && python test_document-extraction.py
#     cd backend && python test_master_pipeline.py
#     cd backend && python test_live_files.py
#
# test_openrouter.py / test_document-extraction.py are also import-safe
# (live code is guarded by __main__), so accidental collection by
# `python -m unittest discover` no longer fires any network request.
testpaths = .
python_files = test_*.py
addopts = -p no:cacheprovider --ignore=test_openrouter.py --ignore=test_document-extraction.py --ignore=test_live_files.py --ignore=test_master_pipeline.py
markers =
    live: live external-service test (OpenRouter / Ollama / uvicorn) — run manually, never in the normal suite